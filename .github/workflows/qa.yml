name: QA
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (alleen voor de tests, geen dependency van de site)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: pdfinfo (controle van de PDF-export in account-e2e)
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build, unit-tests en designaudit
        run: |
          node scripts/build.mjs
          node --test tests/*.test.mjs
          node design-system/check-design.mjs src scripts admin
      - name: Functionele flows en account-e2e (gesimuleerde Supabase)
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          node scripts/flows.mjs
          node scripts/account-e2e.mjs
      - name: RLS-test op PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin; create role authenticated nologin;
          create schema auth; grant usage on schema auth to anon, authenticated; grant usage on schema public to anon, authenticated;
          create table auth.users (id uuid primary key, email text);
          create function auth.jwt() returns jsonb language sql stable as $$ select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb $$;
          create function auth.uid() returns uuid language sql stable as $$ select nullif(auth.jwt() ->> 'sub', '')::uuid $$;
          grant execute on function auth.jwt(), auth.uid() to anon, authenticated;
          insert into auth.users values ('00000000-0000-0000-0000-00000000000a','anna@x.nl'),('00000000-0000-0000-0000-00000000000b','bob@x.nl'),('00000000-0000-0000-0000-00000000000c','carla@x.nl');
          SQL
          sudo -u postgres psql -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261104_user_concepts.sql
          sudo -u postgres psql -q -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
          sudo -u postgres psql -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261105_plans_and_requests.sql -f supabase/tests/plans_requests_test.sql
